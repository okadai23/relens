[workspace]
members = [
    "crates/relens-cli",
    "crates/relens-domain",
    "crates/relens-engine",
    "crates/relens-lift",
    "crates/relens-store",
    "crates/relens-vcs",
]
default-members = ["crates/relens-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/example/relens"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
