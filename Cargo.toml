[package]
name = "relens"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A maintainable command-line application scaffold"
repository = "https://github.com/example/relens"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
