[package]
name = "relens-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for relens"

[[bin]]
name = "relens"
path = "src/main.rs"

[[test]]
name = "features"
path = "../../tests/e2e/tests/features.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
relens-domain = { version = "0.1.0", path = "../relens-domain" }
relens-engine = { version = "0.1.0", path = "../relens-engine" }
relens-lift = { version = "0.1.0", path = "../relens-lift" }
relens-store = { version = "0.1.0", path = "../relens-store" }
relens-vcs = { version = "0.1.0", path = "../relens-vcs" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd = "2"
cucumber = "0.21"
futures = "0.3"
gherkin = "0.14"
predicates = "3"
tempfile = "3"
